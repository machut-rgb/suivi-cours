name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend:
    name: PHP tests & style
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, pdo_sqlite, gd
        coverage: none
    - name: Get Composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: composer-${{ hashFiles('composer.lock') }}
    - name: Install dependencies
      run: composer install -q --no-ansi --no-interaction --no-progress --prefer-dist
    - name: Prepare environment
      run: |
        cp .env.example .env
        php artisan key:generate
    - name: Code style (Pint)
      run: vendor/bin/pint --test
    - name: Tests (Pest, in-memory SQLite)
      run: php artisan test
    - name: Migrations and seed on a file database
      run: |
        touch database/database.sqlite
        php artisan migrate:fresh --seed --no-interaction

  frontend:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # ziggy-js types resolve from vendor/tightenco/ziggy (see tsconfig.json paths).
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        coverage: none
    - name: Install PHP dependencies
      run: composer install -q --no-ansi --no-interaction --no-progress --prefer-dist --no-scripts
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
    - run: npm ci
    - name: Lint
      run: npx eslint resources/js --ext .ts,.tsx
    - name: Typecheck and build (client + SSR)
      run: npm run build

  docker:
    name: Docker image build & smoke test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build image
      run: docker build -t suiviapp:ci .
    - name: Start container (SQLite in the storage volume)
      run: |
        docker run -d --name suiviapp -p 8080:80 \
          -e APP_KEY="base64:$(openssl rand -base64 32)" \
          -e APP_URL=http://localhost:8080 \
          suiviapp:ci
    - name: Smoke test
      run: |
        for i in $(seq 1 30); do
          curl -fsS http://localhost:8080/up > /dev/null && break
          sleep 2
        done
        curl -fsS http://localhost:8080/up > /dev/null
        curl -fsS http://localhost:8080/login | grep -q '<div id="app"'
        test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/dashboard)" = "302"
        docker exec -u www-data suiviapp php artisan app:create-responsable ci@example.com --password=ci-password-123
        docker exec -u www-data suiviapp php artisan migrate:status | grep -q add_classe_and_approval_to_users_table
        test -z "$(curl -sI http://localhost:8080/login | grep -i '^x-powered-by')"
    - name: Container logs
      if: always()
      run: docker logs suiviapp || echo "container was not started"
