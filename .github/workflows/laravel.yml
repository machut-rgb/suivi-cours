name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend:
    name: PHP tests & style
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, pdo_sqlite, gd
        coverage: none
    - name: Get Composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: composer-${{ hashFiles('composer.lock') }}
    - name: Install dependencies
      run: composer install -q --no-ansi --no-interaction --no-progress --prefer-dist
    - name: Prepare environment
      run: |
        cp .env.example .env
        php artisan key:generate
    - name: Code style (Pint)
      run: vendor/bin/pint --test
    - name: Tests (Pest, in-memory SQLite)
      run: php artisan test
    - name: Migrations and seed on a file database
      run: |
        touch database/database.sqlite
        php artisan migrate:fresh --seed --no-interaction

  frontend:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # ziggy-js types resolve from vendor/tightenco/ziggy (see tsconfig.json paths).
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        coverage: none
    - name: Install PHP dependencies
      run: composer install -q --no-ansi --no-interaction --no-progress --prefer-dist --no-scripts
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
    - run: npm ci
    - name: Lint
      run: npx eslint resources/js --ext .ts,.tsx
    - name: Typecheck and build (client + SSR)
      run: npm run build
